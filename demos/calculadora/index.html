<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
    <meta name="description" content="Calculadora aritmética com operações básicas e suporte ao teclado.">
    <title>Calculadora aritmética | Arthur Bruno</title>
</head>
<body>
    <main id="calc" aria-labelledby="calculator-title">
        <h1 id="calculator-title">Calculadora aritmética</h1>
        <p>Operações em sequência, da esquerda para a direita.</p>
        <div id="operations">
            <div id="previous-operation"></div>
            <div id="current-operation" role="status" aria-live="polite" aria-label="Resultado">0</div>
        </div>

        <div id="buttons-container">
            <button type="button" aria-label="Limpar entrada atual">CE</button>
            <button type="button" aria-label="Limpar tudo">C</button>
            <button type="button" aria-label="Apagar último dígito">DEL</button>
            <button>/</button>
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button>*</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button>-</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button>+</button>
            <button class="number">0</button>
            <button class="number">.</button>
            <button id="equal-btn">=</button>
        </div>
    </main>
</body>
</html>
