<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Pokémon, pesquise por nome ou número e consulte tipos, medidas e habilidades.">
<title>Pokédex | Arthur Bruno</title>
<link rel="stylesheet" href="./Css/styles.css">
<script src="./js/source.js" defer></script>
</head>
<body>
<header>
<img id="pokebola" src="./img/Pokebola-pokeball-png-0.png" width="64" height="64" alt="">
<div><h1>Pokédex</h1><p>Descubra seus Pokémon favoritos</p></div>
</header>
<main>
<form id="search-form" role="search">
<label for="searchInput">Nome ou número do Pokémon</label>
<div class="search-controls"><input type="search" id="searchInput" placeholder="Ex.: pikachu ou 25" autocomplete="off">
<button type="submit" id="button-search">Pesquisar</button><button type="button" id="reset-search">Ver todos</button></div>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="listPokemon" aria-label="Pokémon" aria-busy="false"></section>
<nav class="pagination" aria-label="Paginação">
<button id="previous" type="button">Anterior</button><span id="page-label"></span><button id="next" type="button">Próxima</button>
</nav>
<dialog id="pokemon-dialog" aria-labelledby="details-title">
<button id="close-dialog" type="button" autofocus>Fechar detalhes</button>
<div id="pokemon-details"></div>
</dialog>
</main>
<footer>Dados e imagens: <a href="https://pokeapi.co/">PokeAPI</a>. Projeto de estudo de Arthur Bruno.</footer>
</body>
</html>
